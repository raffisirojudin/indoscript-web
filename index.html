<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndoScript Web Playground</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { padding: 10px 20px; background: #252526; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3c3c3c; }
    .logo { font-size: 1.1rem; font-weight: bold; color: #4EC9B0; display: flex; align-items: center; gap: 10px; }
    .status { font-size: 0.85rem; color: #cca700; }
    
    .controls { display: flex; gap: 10px; align-items: center; }
    select, button { background: #3c3c3c; color: #fff; border: 1px solid #555; padding: 6px 12px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; }
    select:hover, button:hover { background: #4a4a4a; }
    button#run-btn { background: #0e639c; border-color: #1177bb; font-weight: bold; }
    button#run-btn:hover { background: #1177bb; }
    button:disabled { background: #2d2d2d; border-color: #444; color: #777; cursor: not-allowed; }

    .container { display: flex; flex: 1; height: calc(100vh - 50px); }
    #editor-container { width: 55%; height: 100%; border-right: 1px solid #3c3c3c; }
    
    .console-panel { width: 45%; height: 100%; display: flex; flex-direction: column; background: #1e1e1e; }
    .console-header { padding: 8px 15px; background: #252526; border-bottom: 1px solid #3c3c3c; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; color: #aaa; }
    #console-output { flex: 1; padding: 15px; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.9rem; color: #d4d4d4; overflow-y: auto; white-space: pre-wrap; line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>IndoScript</span>
      <span id="status" class="status">● Memuat Engine...</span>
    </div>
    <div class="controls">
      <select onchange="muatContoh(this.value)">
        <option value="halo">Contoh: Halo Dunia</option>
        <option value="looping">Contoh: Perulangan</option>
        <option value="fungsi">Contoh: Fungsi & Math</option>
      </select>
      <button onclick="bagikanKode()">🔗 Bagikan</button>
      <button id="run-btn" onclick="jalankanKode()" disabled>▶ Jalankan</button>
    </div>
  </header>

  <div class="container">
    <div id="editor-container"></div>
    <div class="console-panel">
      <div class="console-header">
        <span>Keluaran (Console Output)</span>
        <button onclick="bersihkanConsole()" style="padding: 2px 8px; font-size: 0.75rem;">Bersihkan</button>
      </div>
      <div id="console-output"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
